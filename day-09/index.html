<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Day 09 · Instant Film</title>
  <meta name="description" content="A table of instant prints. Open one and it lifts into a full page, then develops from milky grey into colour.">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="sheet">
    <header>
      <h1>Good light</h1>
      <p>Six prints from one summer.</p>
    </header>
    <ul class="prints" id="prints"></ul>
  </main>

  <section id="detail" hidden aria-labelledby="detail-title">
    <figure class="print big" id="big">
      <div class="photo"><img alt="" id="big-img"><span class="milk" aria-hidden="true"></span></div>
      <figcaption id="big-cap"></figcaption>
    </figure>
    <div class="about">
      <h2 id="detail-title"></h2>
      <p class="meta" id="detail-meta"></p>
      <p class="note" id="detail-note"></p>
      <button type="button" id="back">Back</button>
    </div>
  </section>

  <a class="cu-back" href="../gallery/">All days</a>
  <script type="module" src="./main.js"></script>
</body>
</html>
