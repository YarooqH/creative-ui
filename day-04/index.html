<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Day 04 · Itten Star</title>
  <meta name="description" content="A twelve-part colour star after Johannes Itten. Pick a hue, its complement answers, and one grey square shows how each colour changes the other.">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="page">
    <figure class="star-wrap">
      <svg class="star" id="star" viewBox="-500 -500 1000 1000" role="group" aria-label="Colour star. Use the arrow keys or click a hue.">
        <g id="spin">
          <g id="ring"></g>
          <g id="core"></g>
        </g>
      </svg>
    </figure>

    <section class="study">
      <h1>Every colour<br>asks for its<br>opposite.</h1>
      <p class="lede" id="lede">Yellow and violet. The same grey sits on both, and each colour pushes it toward the other.</p>

      <div class="fields" id="fields">
        <div class="field" id="fieldA"><span class="chip" id="chipA"></span></div>
        <div class="field" id="fieldB"><span class="chip" id="chipB"></span></div>
        <span class="bridge" id="bridge" aria-hidden="true"></span>
      </div>

      <div class="actions">
        <button type="button" id="reveal" aria-pressed="false">Reveal</button>
        <button type="button" id="next">Next</button>
      </div>
    </section>
  </main>

  <a class="cu-back" href="../gallery/">All days</a>
  <script type="module" src="./main.js"></script>
</body>
</html>
