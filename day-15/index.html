<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Day 15 · Film Strip</title>
  <meta name="description" content="Scroll to run a reel of film through the gate. The strip slides under a playhead, and the frame on it plays in the viewer above, with a running timecode.">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <section class="reel" id="reel">
    <div class="bench">
      <header class="slate">
        <h1>Night ferry</h1>
        <p id="hint">Scroll to run the reel.</p>
      </header>

      <figure class="viewer">
        <canvas id="gate" aria-label="The current frame of the reel."></canvas>
        <figcaption>
          <span id="shot">Harbour</span>
          <span id="tc">00:00:00:00</span>
        </figcaption>
      </figure>

      <div class="table">
        <div class="strip" id="strip"><canvas id="film" aria-hidden="true"></canvas></div>
        <div class="playhead" aria-hidden="true"></div>
      </div>
    </div>
  </section>

  <section class="end">
    <p>That's a wrap.</p>
  </section>

  <a class="cu-back" href="../gallery/">All days</a>
  <script type="module" src="./main.js"></script>
</body>
</html>
