<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery · Creative UI</title>
  <meta name="description" content="Every Creative UI piece: recordings, briefs and live demos.">
  <meta name="theme-color" content="#eeebe3">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23141414'/%3E%3Cpath d='M16 2a14 14 0 0 1 0 28a9 14 0 0 0 0-28z' fill='%23f2401f'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="../site/site.css">
  <link rel="stylesheet" href="../site/gallery.css">
  <link rel="stylesheet" href="../site/dither.css">
</head>
<body class="gallery-page">
  <header class="bar">
    <a class="mark" href="../"><i aria-hidden="true"></i>Creative UI</a>
    <nav aria-label="Site">
      <a class="dz-link" href="../">Index</a>
      <a class="dz-link" href="./" aria-current="page">Gallery</a>
      <a class="dz-link" href="https://github.com/YarooqH/creative-ui">Source</a>
    </nav>
  </header>

  <main>
    <header class="g-head">
      <h1 class="dz-type"><span class="sr-only">Gallery</span><canvas id="g-type" aria-hidden="true"></canvas></h1>
      <p class="g-count"><span id="count-built">00</span> <span class="unit" id="count-unit">pieces</span></p>
      <p class="g-intro">
        Every piece so far, with its recording, its brief and a live demo.
      </p>
    </header>

    <div class="g-tools" role="toolbar" aria-label="Filter pieces">
      <div class="chips" id="chips"></div>
      <div class="toggles">
        <button class="sort" id="sort" aria-label="Sort order: oldest first">Oldest first</button>
      </div>
    </div>

    <ol class="g-grid" id="grid" aria-live="polite"></ol>
    <p class="g-empty mono" id="empty" hidden>Nothing in this track yet.</p>
  </main>

  <dialog class="viewer" id="viewer" tabindex="-1" aria-labelledby="v-title">
    <div class="v-inner">
      <div class="v-media" id="v-media"></div>
      <aside class="v-info">
        <div class="v-top">
          <p class="mono" id="v-kicker">Day 01 · Print</p>
          <button class="v-close" id="v-close">Close</button>
        </div>
        <p class="v-num" id="v-num" aria-hidden="true">01</p>
        <h2 id="v-title">Title</h2>
        <p class="v-pair" id="v-pair"></p>
        <dl id="v-brief"></dl>
        <div class="v-actions on-paper" id="v-actions"></div>
        <div class="v-nav">
          <button class="v-step" id="v-prev" aria-label="Previous piece"><span id="v-prev-l">Prev</span></button>
          <button class="v-step" id="v-next" aria-label="Next piece"><span id="v-next-l">Next</span></button>
        </div>
      </aside>
    </div>
  </dialog>

  <script type="module" src="../site/gallery.js"></script>
</body>
</html>
